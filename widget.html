<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colourbox AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--accent:#0D68E8;--accent-hover:#0C60D8;--accent-soft:rgba(13,104,232,.10);
    --bg:#FEFDFD;--panel:#FFFFFF;--line:#E4E5E9;--text:#23282E;--muted:#7C8085;--muted-2:#9DA1A6;--wash:#F2F7FE}
  html,body{height:100%}
  body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  .head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .head .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
  .head .t{flex:1;min-width:0}
  .head .name{font-size:14px;font-weight:700}
  .head .sub{font-size:11px;color:var(--muted-2)}
  .head button{width:30px;height:30px;border:none;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .head button:hover{background:#F5F6F8;color:var(--text)}
  .eu{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}

  .thread{flex:1;overflow-y:auto;padding:14px}
  .msg{display:flex;margin-bottom:12px}
  .msg.user{justify-content:flex-end}
  .bub{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
  .user .bub{background:var(--wash);border:1px solid var(--line);border-bottom-right-radius:4px}
  .bot .bub{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.error{color:#E2400B}
  .bub a{color:var(--accent);word-break:break-all}
  .typing{display:inline-flex;gap:4px;padding:4px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted-2);animation:ty 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes ty{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .status{font-size:11.5px;color:var(--muted);margin-top:4px}

  .foot{flex:none;padding:10px 12px 8px;background:var(--panel);border-top:1px solid var(--line)}
  .row{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13.5px;line-height:1.4;resize:none;outline:none;max-height:110px;color:var(--text)}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .send{width:38px;height:38px;flex:none;border:none;border-radius:9px;background:#EAEAEE;color:#9DA1A6;display:flex;align-items:center;justify-content:center;cursor:not-allowed;transition:background .15s}
  .send.ready{background:var(--accent);color:#fff;cursor:pointer}
  .send.ready:hover{background:var(--accent-hover)}
  .fine{text-align:center;font-size:10.5px;color:var(--muted-2);margin-top:7px}
</style>
</head>
<body>
  <div class="head">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M200 48h-64V16a8 8 0 0 0-16 0v32H56a32 32 0 0 0-32 32v112a32 32 0 0 0 32 32h144a32 32 0 0 0 32-32V80a32 32 0 0 0-32-32Zm-104 88a16 16 0 1 1 16-16 16 16 0 0 1-16 16Zm64 0a16 16 0 1 1 16-16 16 16 0 0 1-16 16Z"/></svg></div>
    <div class="t">
      <div class="name">Colourbox AI <span class="eu">EU</span></div>
      <div class="sub">Svarer typisk med det samme</div>
    </div>
    <button id="closeBtn" title="Luk">✕</button>
  </div>
  <div class="thread" id="thread"></div>
  <div class="foot">
    <div class="row">
      <textarea id="draft" rows="1" placeholder="Skriv en besked…"></textarea>
      <button class="send" id="sendBtn" title="Send"><svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M231.87 114 88.15 30.62A16 16 0 0 0 64.42 48.4l16.19 71.6-16.19 71.6a16 16 0 0 0 23.73 17.77L231.87 142a16 16 0 0 0 0-28Zm-135.31 68 12.28-54.34H160a8 8 0 0 0 0-16H108.84L96.56 57.36 219.28 128Z"/></svg></button>
    </div>
    <div class="fine">Data forbliver i EU · GDPR-compliant</div>
  </div>

<script>
(function () {
  "use strict";
  var messages = [];   // {role, text, error?}
  var streaming = false;
  var threadId = "w" + Date.now();
  var el = function (id) { return document.getElementById(id); };
  var draft = el("draft");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function rich(s) {
    return esc(s).replace(/https?:\/\/[^\s<>&"']+/g, function (u) {
      var c = u.replace(/(?:[),.;!?]|&quot;)+$/, "");
      return '<a href="' + c + '" target="_blank" rel="noopener noreferrer">' + c + "</a>" + u.slice(c.length);
    });
  }

  function render() {
    el("thread").innerHTML = messages.map(function (m) {
      if (m.role === "user") return '<div class="msg user"><div class="bub">' + esc(m.text) + "</div></div>";
      if (m.streaming && !m.text) {
        return '<div class="msg bot"><div class="bub"><div class="typing"><span></span><span></span><span></span></div>' +
          (m.statusText ? '<div class="status">' + esc(m.statusText) + "</div>" : "") + "</div></div>";
      }
      return '<div class="msg bot"><div class="bub' + (m.error ? " error" : "") + '">' + rich(m.text) + "</div></div>";
    }).join("");
    var t = el("thread");
    t.scrollTop = t.scrollHeight;
  }

  function renderSend() {
    el("sendBtn").classList.toggle("ready", draft.value.trim().length > 0 && !streaming);
  }

  function autosize() {
    draft.style.height = "auto";
    draft.style.height = Math.min(draft.scrollHeight, 110) + "px";
  }

  function send() {
    var text = draft.value.trim();
    if (!text || streaming) return;
    messages.push({ role: "user", text: text });
    var reply = { role: "assistant", text: "", streaming: true };
    messages.push(reply);
    draft.value = "";
    autosize();
    streaming = true;
    render();
    renderSend();

    var payload = {
      widget: true,
      model: "Auto",
      threadId: threadId,
      messages: messages.filter(function (m) { return m !== reply && m.text && !m.error; })
        .map(function (m) { return { role: m.role, content: m.text }; })
    };
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          reply.error = true;
          reply.text = j.error || "Der opstod en fejl (" + resp.status + ").";
        });
      }
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = "";
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split("\n");
          buf = lines.pop();
          lines.forEach(function (line) {
            var s = line.trim();
            if (s.indexOf("data:") !== 0) return;
            var data = s.slice(5).trim();
            if (!data || data === "[DONE]") return;
            try {
              var j = JSON.parse(data);
              if (j.status) reply.statusText = j.status;
              if (j.error) { reply.error = true; reply.text += (reply.text ? "\n" : "") + j.error; }
              var d0 = (j.choices && j.choices[0] && j.choices[0].delta) || {};
              if (d0.reasoning_content && !reply.text) reply.statusText = "Tænker…";
              if (d0.content) reply.text += d0.content;
            } catch (e) { /* partial */ }
          });
          render();
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      reply.error = true;
      reply.text = "Netværksfejl: " + err.message;
    }).then(function () {
      reply.streaming = false;
      if (!reply.error && !reply.text.trim()) {
        reply.error = true;
        reply.text = "Svaret blev afbrudt — prøv igen.";
      }
      streaming = false;
      render();
      renderSend();
    });
  }

  el("sendBtn").addEventListener("click", send);
  draft.addEventListener("input", function () { autosize(); renderSend(); });
  draft.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  el("closeBtn").addEventListener("click", function () {
    if (window.parent !== window) window.parent.postMessage("cbx-widget-close", "*");
  });

  messages.push({ role: "assistant", text: "Hej! Jeg er Colourbox' AI-assistent. Hvad kan jeg hjælpe med?" });
  render();
  draft.focus();
})();
</script>
</body>
</html>
