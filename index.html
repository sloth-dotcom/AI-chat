<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{
    /* Colourbox tokens — fra "Oplæg Colourbox.fig" via CBX-new */
    --accent:#0D68E8;--accent-hover:#0C60D8;--accent-soft:rgba(13,104,232,.10);
    --bg:#FEFDFD;--panel:#FFFFFF;--line:#E4E5E9;--line-strong:#D0D0D5;
    --text:#23282E;--muted:#7C8085;--muted-2:#9DA1A6;
    --navy:#0C1530;--wash:#F2F7FE;
  }
  body{margin:0;font-family:'Figtree',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-hover)}
  ::selection{background:#7AB0F4;color:var(--navy)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D0D0D5;border-radius:8px;border:3px solid #FEFDFD}
  ::-webkit-scrollbar-thumb:hover{background:#9DA1A6}
  button{font-family:inherit}
  svg{display:block}

  .app{display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg)}

  /* ---------- Sidebar ---------- */
  .sidebar{flex:none;overflow:hidden;border-right:1px solid var(--line);background:var(--panel);transition:width .22s ease,opacity .18s;width:264px;opacity:1}
  .app.collapsed .sidebar{width:0;opacity:0}
  .sidebar-inner{display:flex;flex-direction:column;height:100%;width:264px;min-width:264px}

  .logo-row{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
  .logo-slot{flex:1;display:flex;align-items:center;padding-left:2px}
  .logo-slot img{height:24px;width:auto;display:block}

  .icon-btn{width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
  .icon-btn:hover{background:#F5F6F8;color:var(--text)}

  .ghost-btn{border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
  .ghost-btn:hover{background:#F5F6F8;color:var(--text)}

  .new-chat-wrap{padding:4px 16px 12px}
  .new-chat{width:100%;height:42px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .15s}
  .new-chat:hover{background:var(--accent-hover)}

  .search-wrap{padding:0 16px 14px}
  .search-box{position:relative}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
  .search-box input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13.5px;color:var(--text);outline:none;font-family:inherit}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .sidebar-scroll{flex:1;overflow-y:auto;padding:0 8px 8px}
  .group{margin-bottom:6px}
  .group-label{padding:12px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
  .conv-row{display:flex;align-items:center;width:100%;padding:8px;border:none;border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left;color:var(--text);font-weight:500;background:transparent}
  .conv-row:hover{background:#F5F6F8}
  .conv-row.active{color:var(--accent);font-weight:600;background:var(--accent-soft)}
  .conv-row .ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv-del{opacity:0;width:22px;height:22px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:opacity .12s}
  .conv-row:hover .conv-del{opacity:1}
  .conv-del:hover{background:#EAEAEE;color:#E2400B}

  .kb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .kb-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px}
  .kb-head .group-label{padding:0}
  .kb-add{width:24px;height:24px;border-radius:6px}
  .doc-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:default}
  .doc-row:hover{background:#F5F6F8}
  .doc-icon{width:30px;height:30px;flex:none;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .doc-body{flex:1;min-width:0}
  .doc-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-meta{font-size:11px;color:var(--muted-2)}
  .doc-del{opacity:0;width:26px;height:26px;flex:none;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:opacity .12s}
  .doc-row:hover .doc-del{opacity:1}
  .doc-del:hover{background:#EAEAEE;color:#E2400B}
  .kb-empty{padding:8px;font-size:12px;color:var(--muted-2);line-height:1.5}

  .mcp-input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:12.5px;color:var(--text);outline:none;font-family:inherit;margin-top:6px}
  .mcp-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .mcp-btn{height:30px;padding:0 12px;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .mcp-save{background:var(--accent);color:#fff}
  .mcp-save:hover{background:var(--accent-hover)}
  .mcp-save:disabled{opacity:.6;cursor:wait}
  .mcp-cancel{background:transparent;color:var(--muted)}
  .mcp-cancel:hover{background:#F5F6F8;color:var(--text)}

  .tool-status{font-size:12.5px;color:var(--muted);margin-top:6px}
  .route-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:11.5px;color:var(--muted);}
  .route-chip svg{color:var(--accent)}
  .msg-img{max-width:min(100%,360px);border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0}
  .assistant-text a{word-break:break-all}

  .user-footer{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .user-body{flex:1;min-width:0}
  .user-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-role{font-size:11px;color:var(--muted-2)}
  .settings-btn{width:32px;height:32px;flex:none;border-radius:7px}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

  .topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(254,253,253,.85);backdrop-filter:blur(8px)}
  .topbar .show-sidebar{display:none}
  .app.collapsed .topbar .show-sidebar{display:flex}
  .thread-title{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar-spacer{flex:1}
  .eu-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}

  .thread-scroll{flex:1;overflow-y:auto}
  .thread{max-width:760px;margin:0 auto;padding:36px 24px 24px}
  .messages{display:flex;flex-direction:column;gap:28px}
  .msg{display:flex}
  .msg.user{justify-content:flex-end}
  .msg.assistant{justify-content:flex-start}
  .user-bubble{max-width:78%;background:#F2F7FE;border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:12px 15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
  .assistant-row{display:flex;gap:14px;max-width:100%}
  .bot-avatar{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--accent);margin-top:2px}
  .assistant-body{flex:1;min-width:0;font-size:14.5px;line-height:1.68;padding-top:3px}
  .assistant-text{white-space:pre-wrap}
  .assistant-text.error{color:#E2400B}
  .typing{display:inline-flex;gap:5px;padding:8px 0}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted-2);animation:typing 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes typing{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .source-chip{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);font-size:12.5px;color:var(--muted)}
  .source-chip .k{color:var(--muted-2)}
  .source-chip .v{color:var(--text);font-weight:500}

  .empty-state{padding:64px 0 8px;text-align:center}
  .empty-icon{width:52px;height:52px;margin:0 auto 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--accent)}
  .empty-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .empty-sub{font-size:14.5px;color:var(--muted);margin-top:8px}

  /* ---------- Composer ---------- */
  .composer{flex:none;background:linear-gradient(to top,var(--bg) 60%,rgba(254,253,253,0));padding:0 24px 16px}
  .composer-inner{max-width:760px;margin:0 auto}

  .suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 0 16px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:13px;color:var(--text);cursor:pointer;transition:all .15s}
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .chip .chip-icon{color:var(--accent);display:inline-flex}

  .model-wrap{position:relative;margin-bottom:10px}
  .model-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer}
  .model-btn:hover{background:#F5F6F8}
  .model-btn .eu-tag{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
  .model-btn .caret{transition:transform .18s}
  .model-btn.open .caret{transform:rotate(180deg)}
  .model-menu{position:absolute;bottom:calc(100% + 6px);left:0;width:280px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 28px rgba(12,21,48,.12);padding:6px;z-index:20;display:none}
  .model-menu.open{display:block}
  .model-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:transparent;border-radius:8px;cursor:pointer;text-align:left}
  .model-row:hover{background:#F5F6F8}
  .model-row .mr-body{flex:1;text-align:left}
  .model-name{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500}
  .model-pill{font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);padding:2px 5px;border-radius:4px}
  .model-desc{font-size:11.5px;color:var(--muted-2);margin-top:1px}

  .input-row{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line-strong);background:var(--panel);border-radius:14px;padding:8px;transition:border-color .15s}
  .input-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .input-row.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #micBtn.rec{background:#FEF5F2;color:#E2400B;animation:micpulse 1.2s infinite}
  #micBtn.busy{color:var(--accent);cursor:wait}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,64,11,.25)}50%{box-shadow:0 0 0 6px rgba(226,64,11,.10)}}

  .attach-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 8px}
  .attach-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;font-size:12.5px;color:var(--text);max-width:280px}
  .attach-chip .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .attach-chip .as{color:var(--muted-2);flex:none}
  .attach-chip.loading .as{color:var(--accent)}
  .attach-chip .ax{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:0 2px;flex:none;font-size:13px;line-height:1;border-radius:4px}
  .attach-chip .ax:hover{color:#E2400B}
  .attach-err{font-size:12.5px;color:#E2400B;padding:0 0 8px}
  .bubble-files{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .bubble-file{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .attach-btn{width:38px;height:38px;flex:none;border-radius:9px}
  .input-row textarea{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:inherit;font-size:14.5px;line-height:1.5;color:var(--text);padding:9px 4px;max-height:160px}
  .send-btn{width:38px;height:38px;flex:none;border:none;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:background .15s;background:#EAEAEE;color:#9DA1A6;cursor:not-allowed}
  .send-btn.ready{background:var(--accent);color:#fff;cursor:pointer}
  .send-btn.ready:hover{background:var(--accent-hover)}

  .trust-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted-2)}

  /* ---------- Login ---------- */
  .login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  .login-card{width:380px;max-width:calc(100vw - 40px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(12,21,48,.09);padding:32px}
  .login-logo{height:28px;width:auto;margin-bottom:22px}
  .login-title{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .login-sub{font-size:14px;color:var(--muted);margin:6px 0 20px}
  .login-label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 6px}
  .login-input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:14px;color:var(--text);outline:none;font-family:inherit}
  .login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .login-btn{width:100%;height:44px;margin-top:20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
  .login-btn:hover{background:var(--accent-hover)}
  .login-btn:disabled{opacity:.6;cursor:wait}
  .login-err{font-size:13px;color:#E2400B;margin-top:12px}
  .login-foot{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;font-size:12px;color:var(--muted-2)}

  /* ---------- Search suggestions ---------- */
  .search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 28px rgba(12,21,48,.12);padding:6px;z-index:30;display:none;max-height:320px;overflow-y:auto}
  .search-drop.open{display:block}
  .sd-label{padding:8px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
  .sd-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border:none;background:transparent;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;color:var(--text);font-family:inherit}
  .sd-item:hover{background:#F5F6F8}
  .sd-item .si{color:var(--accent);display:flex;flex:none}
  .sd-item .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sd-item .sm{flex:none;font-size:11px;color:var(--muted-2)}
  .sd-empty{padding:10px 8px;font-size:12.5px;color:var(--muted-2)}

  /* ---------- Profile ---------- */
  .avatar{overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}

  .chip.chip-nudge{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

  /* ---------- Mobil (iPhone-app + mobil-Safari) ---------- */
  .backdrop{display:none}
  @media (max-width:700px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;box-shadow:0 0 40px rgba(12,21,48,.25)}
    .app.collapsed .sidebar{box-shadow:none}
    .app:not(.collapsed) .backdrop{display:block;position:fixed;inset:0;z-index:50;background:rgba(12,21,48,.35)}
    .topbar{padding:0 12px}
    .thread{padding:20px 14px 16px}
    .user-bubble{max-width:88%}
    .assistant-row{gap:10px}
    .composer{padding:0 10px calc(10px + env(safe-area-inset-bottom))}
    .suggestions{padding-bottom:10px}
    .chip{font-size:12px;padding:7px 11px}
    .eu-pill{display:none}
    .msg-img{max-width:100%}
    .user-footer{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div class="login-screen" id="loginScreen" style="display:none">
  <div class="login-card">
    <img class="login-logo" src="logo-horizontal.png" alt="Colourbox">
    <div class="login-title">Log ind</div>
    <div class="login-sub">Fortsæt til AI-chatten</div>
    <form id="loginForm">
      <label class="login-label" for="loginEmail">E-mail</label>
      <input class="login-input" type="email" id="loginEmail" autocomplete="username" required>
      <label class="login-label" for="loginPass">Adgangskode</label>
      <input class="login-input" type="password" id="loginPass" autocomplete="current-password" required>
      <div class="login-err" id="loginErr" style="display:none"></div>
      <button class="login-btn" type="submit" id="loginBtn">Log ind</button>
    </form>
    <div class="login-foot">
      <svg width="13" height="13" viewBox="0 0 256 256" fill="var(--accent)"><path d="M208 40H48a16 16 0 0 0-16 16v58.78c0 89.61 75.82 119.34 91 124.39a15.53 15.53 0 0 0 10 0c15.2-5.05 91-34.78 91-124.39V56a16 16 0 0 0-16-16Z"/></svg>
      Data forbliver i EU · GDPR-compliant
    </div>
  </div>
</div>
<div class="app" id="app" style="display:none"><div class="backdrop" id="backdrop"></div>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar-inner">

      <div class="logo-row">
        <div class="logo-slot"><img src="logo-horizontal.png" alt="Colourbox"></div>
        <button class="icon-btn" id="collapseBtn" title="Skjul sidepanel">
          <svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16ZM40 56h52v144H40Zm176 144H108V56h108v144Z"/></svg>
        </button>
      </div>

      <div class="new-chat-wrap">
        <button class="new-chat" id="newChatBtn">
          <svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8Z"/></svg>
          Ny chat
        </button>
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="#9DA1A6"><path d="m229.66 218.34-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72Z"/></svg>
          <input id="searchInput" placeholder="Søg i samtaler…" autocomplete="off" />
          <div class="search-drop" id="searchDrop"></div>
        </div>
      </div>

      <div class="sidebar-scroll">
        <div id="groups"></div>

        <div class="kb">
          <div class="kb-head">
            <div class="group-label">Vidensbase</div>
            <button class="ghost-btn kb-add" id="kbAddBtn" title="Upload dokument">
              <svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M224 128a8 8 0 0 1-8 8h-80v80a8 8 0 0 1-16 0v-80H40a8 8 0 0 1 0-16h80V40a8 8 0 0 1 16 0v80h80a8 8 0 0 1 8 8Z"/></svg>
            </button>
          </div>

        <svg width="17" height="17" viewBox="0 0 256 256" fill="currentColor"><path d="M216 40H40a16 16 0 0 0-16 16v144a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a16 16 0 0 0-16-16ZM40 56h52v144H40Zm176 144H108V56h108v144Z"/></svg>

          Data forbliver i EU · GDPR-compliant

<script src="voice.js"></script>
<script>
(function () {
  "use strict";

  var ICONS = {
    doc: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M213.66 82.34l-56-56A8 8 0 0 0 152 24H56a16 16 0 0 0-16 16v176a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V88a8 8 0 0 0-2.34-5.66ZM152 88V44l44 44Z"/></svg>',
    mail: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M224 48H32a8 8 0 0 0-8 8v136a16 16 0 0 0 16 16h176a16 16 0 0 0 16-16V56a8 8 0 0 0-8-8Zm-96 85.15L52.57 64h150.86ZM98.71 128 40 181.81V74.19Zm11.84 10.85 12 11.05a8 8 0 0 0 10.82 0l12-11.05 58 53.15H52.57ZM157.29 128 216 74.18v107.63Z"/></svg>',
    chart: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M224 200h-8V40a8 8 0 0 0-8-8h-56a8 8 0 0 0-8 8v40H96a8 8 0 0 0-8 8v40H48a8 8 0 0 0-8 8v56h-8a8 8 0 0 0 0 16h192a8 8 0 0 0 0-16ZM160 48h40v152h-40Zm-56 48h40v104h-40Zm-48 48h32v56H56Z"/></svg>',
    translate: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M239.15 212.42l-56-112a8 8 0 0 0-14.31 0l-21.71 43.43A88 88 0 0 1 100.65 68H128a8 8 0 0 0 0-16H88V40a8 8 0 0 0-16 0v12H32a8 8 0 0 0 0 16h52.51a103.85 103.85 0 0 0 26.02 60.53 103.4 103.4 0 0 1-30.68 20.35 8 8 0 0 0 6.3 14.7 119.6 119.6 0 0 0 36-24.36 119.13 119.13 0 0 0 24.29 18.44l-12.24 24.48a8 8 0 1 0 14.31 7.16L163.06 200h49.88l6.61 13.24a8 8 0 0 0 14.31-7.16Zm-68.11-28.42L188 150.11 204.94 184Z"/></svg>',
    bot: '<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M200 48h-64V16a8 8 0 0 0-16 0v32H56a32 32 0 0 0-32 32v112a32 32 0 0 0 32 32h144a32 32 0 0 0 32-32V80a32 32 0 0 0-32-32Zm-104 88a16 16 0 1 1 16-16 16 16 0 0 1-16 16Zm64 0a16 16 0 1 1 16-16 16 16 0 0 1-16 16Z"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 256 256" fill="var(--accent)"><path d="M229.66 77.66l-128 128a8 8 0 0 1-11.32 0l-56-56a8 8 0 0 1 11.32-11.32L96 188.69 218.34 66.34a8 8 0 0 1 11.32 11.32Z"/></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16ZM96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Zm48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0Z"/></svg>',
    clock: '<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24Zm0 192a88 88 0 1 1 88-88 88.1 88.1 0 0 1-88 88Zm64-88a8 8 0 0 1-8 8h-56a8 8 0 0 1-8-8V80a8 8 0 0 1 16 0v48h48a8 8 0 0 1 8 8Z"/></svg>',
    spark: '<svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M208 144a15.78 15.78 0 0 1-10.42 14.94l-51.65 19-19 51.61a15.92 15.92 0 0 1-29.88 0l-19-51.66-51.61-19a15.92 15.92 0 0 1 0-29.88l51.65-19 19-51.61a15.92 15.92 0 0 1 29.88 0l19 51.65 51.61 19A15.78 15.78 0 0 1 208 144ZM152 48h16v16a8 8 0 0 0 16 0V48h16a8 8 0 0 0 0-16h-16V16a8 8 0 0 0-16 0v16h-16a8 8 0 0 0 0 16Zm88 32h-8v-8a8 8 0 0 0-16 0v8h-8a8 8 0 0 0 0 16h8v8a8 8 0 0 0 16 0v-8h8a8 8 0 0 0 0-16Z"/></svg>',
    bolt: '<svg width="15" height="15" viewBox="0 0 256 256" fill="currentColor"><path d="M215.79 118.17a8 8 0 0 0-5-5.66L153.18 90.9l14.66-73.33a8 8 0 0 0-13.69-7l-112 120a8 8 0 0 0 3 13l57.63 21.61-14.66 73.33a8 8 0 0 0 13.69 7l112-120a8 8 0 0 0 1.98-7.34Z"/></svg>'
  };

  var state = {
    sidebarCollapsed: false,
    query: "",
    modelOpen: false,
    activeModel: "Auto",
    activeId: "_new"
  };
  var currentUser = null;
  var voiceNext = false;   // næste svar læses op

  var models = [
    { id: "Auto", name: "Auto", pill: "EU", desc: "Routeren vælger den bedste model til opgaven" },
    { id: "GLM-5.2", name: "GLM-5.2", pill: "EU", desc: "Hurtig og alsidig · EU-hostet" },
    { id: "Kimi K3", name: "Kimi K3", pill: "EU", desc: "Lang kontekst · EU-hostet" },
    { id: "Mistral (EU)", name: "Mistral", pill: "EU", desc: "Fransk model · EU-hostet" }
  ];

  function loadKb() {
    try {
      var v = JSON.parse(localStorage.getItem("aiChatKB") || "[]");
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  var kbDocs = loadKb();

  function saveKb() {
    try {
      localStorage.setItem("aiChatKB", JSON.stringify(kbDocs.filter(function (d) { return !d.loading; })));
    } catch (e) {
      showAttachErr("Vidensbasen kunne ikke gemmes — browserens lager er fuldt. Slet et dokument og prøv igen.");
    }
  }

  function docType(name) { return /\.pdf$/i.test(name) ? "PDF" : "Tekst"; }

  var baseSuggestions = [
    { label: "Opsummér et dokument", icon: ICONS.doc },
    { label: "Skriv et udkast til en mail", icon: ICONS.mail },
    { label: "Analysér data", icon: ICONS.chart },
    { label: "Oversæt en tekst", icon: ICONS.translate }
  ];

  var threads = {};                                    // loaded from /api/chats
  var newThread = { title: "Ny chat", messages: [] };  // ephemeral until first send

  var el = function (id) { return document.getElementById(id); };
  var app = el("app");
  var draftEl = el("draft");

  function getThread(id) {
    return threads[id] || newThread;
  }

  function threadList() {
    return Object.keys(threads).map(function (id) {
      var t = threads[id];
      return { id: id, title: t.title, updatedAt: t.updatedAt || 0 };
    }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });
  }

  function dayStart(ts) {
    var d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  function relTime(ts) {
    if (!ts) return "";
    var today = dayStart(Date.now());
    var d = dayStart(ts);
    if (d >= today) return "i dag";
    if (d >= today - 86400000) return "i går";
    return Math.round((today - d) / 86400000) + " dage siden";
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Human label for the router's reason field (the product's "why").
  function reasonLabel(r) {
    if (!r) return "";
    if (r === "manual") return "manuelt valg";
    if (r === "failopen") return "fallback";
    if (r === "rule:short_simple") return "kort & simpel";
    if (r === "rule:code_detected") return "kode registreret";
    if (r === "rule:budget_cap") return "budgetloft nået";
    var h = r.match(/^heuristic:score=(\d+)/);
    if (h) return "heuristik · score " + h[1];
    var p = r.match(/^ml:p=([\d.]+)/);
    if (p) return "P(godt nok) = " + p[1];
    return r;
  }

  // Escape, then turn URLs into links and image URLs into inline images.
  function renderRich(s) {
    return esc(s).replace(/https?:\/\/[^\s<>"']+/g, function (u) {
      var clean = u.replace(/(?:[),.;!?]|&quot;)+$/, "");
      var trail = u.slice(clean.length);
      var isImg = /\.(png|jpe?g|gif|webp)(\?|&|$)/i.test(clean) || /images\.unsplash\.com/i.test(clean);
      if (isImg) return '<img class="msg-img" src="' + clean + '" alt="" loading="lazy">' + trail;
      return '<a href="' + clean + '" target="_blank" rel="noopener noreferrer">' + clean + "</a>" + trail;
    });
  }

  /* ---------- Sidebar groups ---------- */
  function renderGroups() {
    var q = state.query.trim().toLowerCase();
    var list = threadList().filter(function (t) { return !q || t.title.toLowerCase().indexOf(q) !== -1; });
    var today = dayStart(Date.now());
    var groups = [
      { label: "I dag", items: [] },
      { label: "I går", items: [] },
      { label: "Tidligere", items: [] }
    ];
    list.forEach(function (t) {
      var d = dayStart(t.updatedAt);
      (d >= today ? groups[0] : d >= today - 86400000 ? groups[1] : groups[2]).items.push(t);
    });
    var html = "";
    groups.forEach(function (g) {
      if (!g.items.length) return;
      html += '<div class="group"><div class="group-label">' + esc(g.label) + "</div>";
      g.items.forEach(function (t) {
        html += '<button class="conv-row' + (t.id === state.activeId ? " active" : "") + '" data-id="' + t.id + '">' +
          '<span class="ct">' + esc(t.title) + '</span>' +
          '<span class="conv-del" data-del="' + t.id + '" title="Slet samtale">' + ICONS.trash + "</span></button>";
      });
      html += "</div>";
    });
    if (!html) html = '<div class="kb-empty">Ingen samtaler endnu — start en ny chat.</div>';
    el("groups").innerHTML = html;
  }

  /* ---------- Knowledge base ---------- */
  function renderDocs() {
    if (!kbDocs.length) {
      el("docs").innerHTML = '<div class="kb-empty">Ingen dokumenter endnu — klik + for at uploade tekstfiler eller PDF.</div>';
      return;
    }
    el("docs").innerHTML = kbDocs.map(function (d) {
      return '<div class="doc-row"><div class="doc-icon">' + ICONS.doc + "</div>" +
        '<div class="doc-body"><div class="doc-name">' + esc(d.name) + '</div><div class="doc-meta">' +
        (d.loading ? "læser…" : docType(d.name) + " · " + fmtSize(d.size)) + "</div></div>" +
        '<button class="doc-del" data-id="' + d.id + '" title="Slet">' + ICONS.trash + "</button></div>";
    }).join("");
  }

  /* ---------- Thread ---------- */
  function renderThread() {
    var thread = getThread(state.activeId);
    el("threadTitle").textContent = thread.title;

    if (!thread.messages.length) {
      el("thread").innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-icon"><svg width="26" height="26" viewBox="0 0 256 256" fill="currentColor"><path d="M200 48h-64V16a8 8 0 0 0-16 0v32H56a32 32 0 0 0-32 32v112a32 32 0 0 0 32 32h144a32 32 0 0 0 32-32V80a32 32 0 0 0-32-32Zm-104 88a16 16 0 1 1 16-16 16 16 0 0 1-16 16Zm64 0a16 16 0 1 1 16-16 16 16 0 0 1-16 16Z"/></svg></div>' +
        '<div class="empty-title">Hvad kan jeg hjælpe med?</div>' +
        '<div class="empty-sub">Stil et spørgsmål, eller vælg et forslag herunder.</div>' +
        "</div>";
    } else {
      el("thread").innerHTML = '<div class="messages">' + thread.messages.map(function (m) {
        if (m.role === "user") {
          var chips = (m.attachments || []).map(function (a) {
            return '<span class="bubble-file"><span style="color:var(--accent);display:flex">' + ICONS.doc + "</span>" +
              esc(a.name) + ' <span style="color:var(--muted-2)">(' + fmtSize(a.size) + ")</span></span>";
          }).join("");
          return '<div class="msg user"><div class="user-bubble">' + esc(m.text) +
            (chips ? '<div class="bubble-files">' + chips + "</div>" : "") + "</div></div>";
        }
        var src = m.hasSource
          ? '<div class="source-chip"><svg width="14" height="14" viewBox="0 0 256 256" fill="var(--accent)"><path d="M213.66 82.34l-56-56A8 8 0 0 0 152 24H56a16 16 0 0 0-16 16v176a16 16 0 0 0 16 16h144a16 16 0 0 0 16-16V88a8 8 0 0 0-2.34-5.66ZM152 88V44l44 44Z"/></svg><span class="k">Kilde:</span><span class="v">' + esc(m.source) + "</span></div>"
          : "";
        var routeChip = m.routing
          ? '<div class="route-chip"><svg width="12" height="12" viewBox="0 0 256 256" fill="currentColor"><path d="M215.79 118.17a8 8 0 0 0-5-5.66L153.18 90.9l14.66-73.33a8 8 0 0 0-13.69-7l-112 120a8 8 0 0 0 3 13l57.63 21.61-14.66 73.33a8 8 0 0 0 13.69 7l112-120a8 8 0 0 0 1.98-7.34Z"/></svg>Auto → ' +
            esc(m.routing.model) + " · " + esc(reasonLabel(m.routing.reason)) +
            (m.routing.escalated ? " · eskaleret" : "") + "</div>"
          : "";
        var body = m.streaming && !m.text
          ? '<div class="typing"><span></span><span></span><span></span></div>' +
            (m.statusText ? '<div class="tool-status">' + esc(m.statusText) + "</div>" : "")
          : '<div class="assistant-text' + (m.error ? " error" : "") + '">' + renderRich(m.text) + "</div>" + routeChip;
        return '<div class="msg assistant"><div class="assistant-row">' +
          '<div class="bot-avatar">' + ICONS.bot + '</div>' +
          '<div class="assistant-body">' + body + src + "</div>" +
          "</div></div>";
      }).join("") + "</div>";
    }

    if (!thread.messages.length) renderSuggestions();
    el("suggestions").style.display = thread.messages.length ? "none" : "flex";
  }

  function buildSuggestions() {
    var out = [];
    var recent = threadList();
    if (recent.length && recent[0].updatedAt > Date.now() - 7 * 86400000) {
      out.push({ type: "resume", label: "Fortsæt: " + recent[0].title, threadId: recent[0].id, nudge: true, icon: ICONS.clock });
    }
    recent.slice(0, 2).forEach(function (t) {
      out.push({ type: "draft", label: "Følg op på: " + t.title, icon: ICONS.spark,
        draft: 'Følg op på vores samtale om "' + t.title + '": hvad er de vigtigste næste skridt?' });
    });
    kbDocs.filter(function (d) { return !d.loading; }).slice(0, 2).forEach(function (d) {
      out.push({ type: "draft", label: "Spørg til " + d.name, icon: ICONS.doc,
        draft: 'Hvad siger dokumentet "' + d.name + '" om ' });
    });
    baseSuggestions.forEach(function (s) {
      out.push({ type: "draft", label: s.label, draft: s.label, icon: s.icon });
    });
    return out.slice(0, 6);
  }

  var currentChips = [];
  function renderSuggestions() {
    currentChips = buildSuggestions();
    el("suggestions").innerHTML = currentChips.map(function (s, i) {
      return '<button class="chip' + (s.nudge ? " chip-nudge" : "") + '" data-i="' + i + '">' +
        '<span class="chip-icon">' + s.icon + "</span>" + esc(s.label) + "</button>";
    }).join("");
  }

  /* ---------- Search dropdown ---------- */
  function renderSearchDrop() {
    var q = state.query.trim().toLowerCase();
    var list = threadList();
    var html = "";
    if (!q) {
      var recent = list.slice(0, 4);
      if (recent.length) {
        html += '<div class="sd-label">Seneste</div>';
        recent.forEach(function (t) {
          html += '<button class="sd-item" data-act="open" data-id="' + t.id + '"><span class="si">' + ICONS.clock +

  /* ---------- Attachments ---------- */
  var PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  var PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var TEXT_EXT = /\.(txt|md|markdown|csv|json|log|xml|yml|yaml|html?|css|js|ts|jsx|tsx|py|java|c|h|cpp|sql|sh)$/i;
  var MAX_FILE_BYTES = 5 * 1024 * 1024;
  var MAX_CHARS_PER_FILE = 30000;

  var pendingFiles = [];
  var attachSeq = 0;
  var pdfjsPromise = null;

  function fmtSize(b) {
    return b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";
  }

  function showAttachErr(msg) {
    var e = el("attachErr");
    e.textContent = msg;
    e.style.display = "block";
    clearTimeout(showAttachErr._t);
    showAttachErr._t = setTimeout(function () { e.style.display = "none"; }, 6000);
  }

  function renderAttachRow() {
    var row = el("attachRow");
    if (!pendingFiles.length) {
      row.style.display = "none";
      row.innerHTML = "";
    } else {
      row.style.display = "flex";
      row.innerHTML = pendingFiles.map(function (f) {
        return '<span class="attach-chip' + (f.loading ? " loading" : "") + '">' +
          '<span style="color:var(--accent);display:flex">' + ICONS.doc + "</span>" +
          '<span class="an">' + esc(f.name) + "</span>" +
          '<span class="as">' + (f.loading ? "læser…" : fmtSize(f.size)) + "</span>" +
          '<button class="ax" data-id="' + f.id + '" title="Fjern">✕</button>' +
          "</span>";
      }).join("");
    }
    renderSend();
  }

  function loadPdfJs() {
    if (!pdfjsPromise) {
      pdfjsPromise = new Promise(function (resolve, reject) {
        if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
        var s = document.createElement("script");
        s.src = PDFJS_URL;
        s.onload = function () {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
          resolve(window.pdfjsLib);
        };
        s.onerror = function () { pdfjsPromise = null; reject(new Error("kunne ikke indlæse PDF-læseren")); };
        document.head.appendChild(s);
      });
    }
    return pdfjsPromise;
  }

  function extractPdf(file) {
    return loadPdfJs().then(function (pdfjs) {
      return file.arrayBuffer().then(function (buf) {
        return pdfjs.getDocument({ data: buf }).promise;
      }).then(function (doc) {
        var chain = Promise.resolve("");
        var pn;
        var addPage = function (p) {
          chain = chain.then(function (acc) {
            if (acc.length > MAX_CHARS_PER_FILE) return acc;
            return doc.getPage(p).then(function (page) { return page.getTextContent(); }).then(function (tc) {
              return acc + tc.items.map(function (it) { return it.str; }).join(" ") + "\n";
            });
          });
        };
        for (pn = 1; pn <= doc.numPages; pn++) addPage(pn);
        return chain;
      });
    });
  }

  function fileTypeError(file) {
    if (file.size > MAX_FILE_BYTES) return '"' + file.name + '" er for stor (maks 5 MB).';
    var isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
    var isText = TEXT_EXT.test(file.name) || (file.type && file.type.indexOf("text/") === 0) || file.type === "application/json";
    if (!isPdf && !isText) return '"' + file.name + '" understøttes ikke — vedhæft tekstfiler eller PDF.';
    return null;
  }

  function readFileText(file) {
    var isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
    var read = isPdf ? extractPdf(file) : file.text();
    return read.then(function (text) {
      text = String(text || "").trim();
      if (text.length > MAX_CHARS_PER_FILE) text = text.slice(0, MAX_CHARS_PER_FILE) + "\n… [afkortet]";
      return text;
    });
  }

  function addFiles(fileList) {
    Array.prototype.forEach.call(fileList, function (file) {
      var err = fileTypeError(file);
      if (err) { showAttachErr(err); return; }
      var entry = { id: ++attachSeq, name: file.name, size: file.size, text: "", loading: true };
      pendingFiles.push(entry);
      renderAttachRow();
      readFileText(file).then(function (text) {
        if (!text) {
          pendingFiles = pendingFiles.filter(function (f) { return f !== entry; });
          showAttachErr('Kunne ikke finde tekst i "' + file.name + '".');
        } else {
          entry.text = text;
          entry.loading = false;
        }
        renderAttachRow();
      }).catch(function (err2) {
        pendingFiles = pendingFiles.filter(function (f) { return f !== entry; });
        showAttachErr('Kunne ikke læse "' + file.name + '": ' + err2.message);
        renderAttachRow();
      });
    });
    el("fileInput").value = "";
  }

  function addKbFiles(fileList) {
    Array.prototype.forEach.call(fileList, function (file) {
      var err = fileTypeError(file);
      if (err) { showAttachErr(err); return; }
      var entry = { id: "kb" + Date.now() + "-" + (++attachSeq), name: file.name, size: file.size, text: "", loading: true };
      kbDocs.push(entry);
      renderDocs();
      readFileText(file).then(function (text) {
        if (!text) {
          kbDocs = kbDocs.filter(function (d) { return d !== entry; });
          showAttachErr('Kunne ikke finde tekst i "' + file.name + '".');
        } else {
          entry.text = text;
          entry.loading = false;
          saveKb();
        }
        renderDocs();
      }).catch(function (err2) {
        kbDocs = kbDocs.filter(function (d) { return d !== entry; });
        showAttachErr('Kunne ikke læse "' + file.name + '": ' + err2.message);
        renderDocs();
      });
    });
    el("kbFileInput").value = "";
  }

  function send() {
    var text = draftEl.value.trim();
    var files = pendingFiles.slice();
    if (!text && !files.length) return;
    if (files.some(function (f) { return f.loading; })) return; // wait for extraction
    var thread = getThread(state.activeId);
    var last = thread.messages[thread.messages.length - 1];
    if (last && last.streaming) return; // one reply at a time per thread
    if (state.activeId === "_new") {
      var id = "t" + Date.now();
      if (!thread.messages.length) thread.title = (text || files[0].name).slice(0, 40);
      threads[id] = thread;
      newThread = { title: "Ny chat", messages: [] };
      state.activeId = id;
    }
    thread.updatedAt = Date.now();
    var apiText = text || "Se den vedhæftede fil.";
    files.forEach(function (f) {
      apiText += "\n\n[Vedhæftet fil: " + f.name + "]\n---\n" + f.text + "\n---";
    });
    thread.messages.push({
      role: "user",
      text: text,
      attachments: files.map(function (f) { return { name: f.name, size: f.size }; }),
      apiText: apiText
    });
    pendingFiles = [];
    renderAttachRow();
    if (window.CbxVoice) CbxVoice.stopSpeak();
    var reply = { role: "assistant", text: "", streaming: true, speak: voiceNext };
    voiceNext = false;
    thread.messages.push(reply);
    draftEl.value = "";
    autosize();
    renderGroups();
    renderThread();
    renderSend();
    scrollBottom();
    saveChats();
    streamReply(state.activeId, thread, reply);
  }

  /* ---------- Integrationer (MCP) ---------- */
  var mcpServers = [];

  function renderMcp() {
    if (!mcpServers.length) {

        '<button class="doc-del" data-mcp="' + s.id + '" title="Fjern">' + ICONS.trash + "</button></div>";
    }).join("");
  }

  function loadMcp() {
    return fetch("/api/mcp").then(function (r) { return r.ok ? r.json() : { servers: [] }; })
      .then(function (d) { mcpServers = d.servers || []; renderMcp(); })
      .catch(function () { mcpServers = []; renderMcp(); });
  }

  /* ---------- Persistence ---------- */
  var saveTimer = null;
  function saveChats() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var clean = {};
      Object.keys(threads).forEach(function (id) {
        var t = threads[id];
        clean[id] = {
          title: t.title,
          updatedAt: t.updatedAt || 0,
          messages: t.messages.filter(function (m) { return !m.streaming; }).map(function (m) {
            var o = { role: m.role, text: m.text };
            if (m.apiText) o.apiText = m.apiText;
            if (m.attachments && m.attachments.length) o.attachments = m.attachments;
            if (m.routing) o.routing = m.routing;
            if (m.error) o.error = true;
            return o;
          })
        };
      });
      fetch("/api/chats", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ threads: clean })
      }).catch(function () { /* retry on next change */ });
    }, 600);
  }

  function loadChats() {
    return fetch("/api/chats").then(function (r) {
      return r.ok ? r.json() : { threads: {} };
    }).then(function (data) {
      threads = (data && data.threads) || {};
    }).catch(function () { threads = {}; });
  }

  function streamReply(threadId, thread, reply) {
    var payload = {
      model: state.activeModel,
      threadId: threadId,
      messages: thread.messages
        .filter(function (m) { return m !== reply && (m.text || m.apiText); })
        .map(function (m) { return { role: m.role, content: m.apiText || m.text }; })
    };
    var kbReady = kbDocs.filter(function (d) { return !d.loading && d.text; });
    if (kbReady.length) {
      payload.kb = kbReady.map(function (d) { return { name: d.name, text: d.text }; });
    }
    var rerender = function () {
      if (state.activeId === threadId) { renderThread(); scrollBottom(); }
    };

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().catch(function () { return {}; }).then(function (j) {
          reply.error = true;
          reply.text = (j.error || "Der opstod en fejl (" + resp.status + ").") + (j.detail ? "\n\n" + j.detail : "");
        });
      }
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var buf = "";
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buf += dec.decode(r.value, { stream: true });
          var lines = buf.split("\n");
          buf = lines.pop();
          lines.forEach(function (line) {
            var s = line.trim();
            if (s.indexOf("data:") !== 0) return;
            var data = s.slice(5).trim();
            if (!data || data === "[DONE]") return;
            try {
              var j = JSON.parse(data);
              if (j.routing) { reply.routing = j.routing; }
              if (j.status) { reply.statusText = j.status; }
              if (j.error) { reply.error = true; reply.text += (reply.text ? "\n" : "") + j.error; }
              var d0 = (j.choices && j.choices[0] && j.choices[0].delta) || {};
              if (d0.reasoning_content && !reply.text) reply.statusText = "Tænker…";
              if (d0.content) reply.text += d0.content;
            } catch (e) { /* partial frame — ignored */ }
          });
          rerender();
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      reply.error = true;
      reply.text = "Netværksfejl: " + err.message;
    }).then(function () {
      reply.streaming = false;
      if (reply.error && !reply.text) reply.text = "Der opstod en fejl.";
      if (!reply.error && !reply.text.trim()) {
        reply.error = true;
        reply.text = "Svaret blev afbrudt, før der kom indhold — prøv igen (eller vælg en anden model i vælgeren).";
      }
      thread.updatedAt = Date.now();
      saveChats();
      rerender();
      if (reply.speak && !reply.error && window.CbxVoice) CbxVoice.speak(reply.text);
    });
  }

  function showApp(user) {
    currentUser = user;
    el("userName").textContent = user.name || user.email;
    el("userRole").textContent = user.role || "";
    el("loginScreen").style.display = "none";
    el("app").style.display = "flex";
  }

  function startUi() {
    if (isMobile()) {
      state.sidebarCollapsed = true;
      app.classList.add("collapsed");
    }
    state.activeId = "_new";
    newThread = { title: "Ny chat", messages: [] };
    renderGroups();
    renderDocs();
    renderMcp();
    loadMcp();
    renderModel();
    renderSend();
    renderThread();
  }

  el("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = el("loginBtn");
    btn.disabled = true;
    el("loginErr").style.display = "none";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: el("loginEmail").value, password: el("loginPass").value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (!res.ok) throw new Error(res.j.error || "Login mislykkedes — prøv igen.");
      el("loginPass").value = "";
      return loadChats().then(function () { showApp(res.j.user); startUi(); });
    }).catch(function (err) {
      var e2 = el("loginErr");
      e2.textContent = err.message;
      e2.style.display = "block";
    }).then(function () { btn.disabled = false; });
  });

  el("logoutBtn").addEventListener("click", function () {
    fetch("/api/logout", { method: "POST" }).catch(function () {}).then(function () {
      threads = {};
      showLogin();
    });
  });

  fetch("/api/session").then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (j) {
    if (j && j.ok) return loadChats().then(function () { showApp(j.user); startUi(); });
    showLogin();
  }).catch(showLogin);
})();
</script>
</body>
</html>
